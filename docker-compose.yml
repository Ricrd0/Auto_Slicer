services:
  auto-slicer:
    build:
      context: .
      args:
        CURA_VERSION: "5.13.0"
        ORCA_VERSION: "2.4.2"
    ports:
      - "8080:8080"
    environment:
      AUTO_SLICER_CURA_FALLBACK: /host-cura
      AUTO_SLICER_ORCA_FALLBACK: /host-orca
      AUTO_SLICER_HOST_DRIVES: /host-drives
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
      - ./data/cura-config:/data/cura-config
      - ./data/app:/data/app
      - ${APPDATA:-.}/cura:/host-cura:ro
      - ${APPDATA:-.}/OrcaSlicer:/host-orca:ro
      - /run/desktop/mnt/host:/host-drives
